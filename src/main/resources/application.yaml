server:
  port: 8081
  servlet:
    context-path: /api
spring:
  jackson:
    time-zone: UTC
  datasource:
    url: "jdbc:mysql://localhost:3307/bookingClone"
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update # create, create-drop, update, validate, none
  sql:
    init:
      mode: never
jwt:
  signerKey: "ISaeBKjUzdPg8OWFRm5Cq42I4XZlefm2s/6nxKOpC+j8aHQ16dYfX6ON6AAfu3Te"
  valid-duration: 60
  refreshable-duration: 120

file:
  upload-dir: "D:/booking-hotel/uploads"
  upload-post: "thumbnail_post"
  upload-user: "user"
  upload-posts: "posts"

vnpay:
    tmn-code: YOUR_TMN_CODE
    hash-secret: YOUR_HASH_SECRET
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/payment/return
    version: 2.1.0
    command: pay
    currency: VND
    locale: vn
