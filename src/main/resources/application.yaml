server:
  port: 8081
  servlet:
    context-path: /api
spring:
  jackson:
    time-zone: UTC
  datasource:
    url: "jdbc:mysql://localhost:3307/bookingClone"
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update # create, create-drop, update, validate, none
  sql:
    init:
      mode: never
jwt:
  signerKey: "ISaeBKjUzdPg8OWFRm5Cq42I4XZlefm2s/6nxKOpC+j8aHQ16dYfX6ON6AAfu3Te"
  refreshKey: "LYjGvnymaVpFeBWmNa9em47aXL5kO52iIgROR0Er8Bs4shXCcR6KjkmDzLMOAFEA"
  resetKey: "zAK73Omd9luql0y7QKPeQbrXaNbsD69ityClw3JKxeZd3zXC2v7bF2fCCrfqnmcT"
  valid-duration: 60
  refreshable-duration: 120
  access-token:
    expiry-in-minutes: ${JWT_ACCESS_TOKEN_IN_MINUTES:15}
  refresh-token:
    expiry-in-days: ${JWT_REFRESH_TOKEN_IN_DAYS:20}
  reset:
    expiry-in-minutes: ${JWT_RESET_TOKEN_IN_MINUTES:15}

outbound:
  identity:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${REDIRECT-URL}

file:
  upload-dir: "D:/booking-hotel/uploads"
  upload-post: "thumbnail_post"
  upload-user: "user"
  upload-posts: "posts"

vnpay:
    tmn-code: YOUR_TMN_CODE
    hash-secret: YOUR_HASH_SECRET
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/payment/return
    version: 2.1.0
    command: pay
    currency: VND
    locale: vn

  # Redis
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:123456}

